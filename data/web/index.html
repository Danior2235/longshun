        <div class="lead">
          <div class="l-company">${esc(l.company)}</div>
          <div class="l-line">联系人: <b>${esc(l.contact || '—')}</b> · 电话: <b>${esc(l.phone || '—')}</b></div>
          <div class="l-line">业务类型: <b>${esc(bizMap[l.biz_type] || l.biz_type || '—')}</b></div>
          ${l.source ? `<div class="l-line">来源: <b>${esc(l.source)}</b></div>` : ''}
          ${l.suggest ? `<div class="l-line">建议: <b>${esc(l.suggest)}</b></div>` : ''}
          <div class="l-tags">
            <span class="badge gold">${esc(bizMap[l.biz_type] || '潜在')}</span>
            ${l.industry ? `<span class="badge blue">${esc(l.industry)}</span>` : ''}
            ${l.priority ? `<span class="badge ${l.priority === 'high' ? 'red' : 'orange'}">${esc(l.priority)}优先级</span>` : ''}
          </div>
          <div class="l-actions">
            <button class="btn gold sm" onclick="goBookLead(${i})">📝 发起预订</button>
            <button class="btn sm" onclick="gotoPage('quote',{quote_tab:'${l.biz_type === 'banquet' || l.biz_type === 'meeting' ? 'venue' : 'room'}'})">💡 智能报价</button>
          </div>
        </div>`).join('') : `<div class="empty" style="grid-column:1/-1"><div class="big">🎯</div>暂无线索数据</div>`}
      </div>
    </div>
  </div>`;
  window.__leads = leads;
}
function goBookLead(i) {
  const l = window.__leads[i];
  if (!l) return;
  const biz = { meeting: '会议', banquet: '宴会', accommodation: '住宿', training: '培训', other: '其他' }[l.biz_type] || l.biz_type || '';
  gotoPage('booking', {
    customer: l.company, phone: l.phone,
    remark: [biz, l.suggest].filter(Boolean).join(' · '),
    source: `客户线索「${l.company}」`,
  });
}

/* ================= 任务协同 ================= */
const MOD_PAGE = { maintenance: 'sync', 维修: 'sync', repair: 'sync', purchase: 'sync', 采购: 'sync', stock: 'sync',
  sales: 'leads', 销售: 'leads', lead: 'leads', 线索: 'leads',
  booking: 'booking', 预订: 'booking', pay: 'pay', 支付: 'pay',
  invoice: 'invoice', 开票: 'invoice', finance: 'invoice', 财务: 'invoice' };
function pageRef(m) {
  m = String(m || '');
  const pg = MOD_PAGE[m.toLowerCase()] || MOD_PAGE[m];
  return pg ? `<a style="color:var(--blue);cursor:pointer" onclick="gotoPage('${pg}')">${esc(m)} →</a>` : esc(m);
}
async function renderTasks(c) {
  const tasks = await API.get('/api/tasks');
  c.innerHTML = `
  <div class="panel">
    <div class="panel-head"><h3>✅ 协同任务 <span style="color:var(--muted);font-size:12px">(共 ${tasks.length} 个)</span></h3>
      <div class="right"><span class="badge gray">data/tasks.json</span></div></div>
    <div class="panel-body flush">
      <table><thead><tr><th>任务</th><th>模块</th><th>负责人</th><th>优先级</th><th>状态</th><th>截止</th></tr></thead>
      <tbody>
        ${tasks.length ? tasks.map(t => `<tr>
          <td>${esc(t.title || t.name)}</td><td>${pageRef(t.module)}</td>
          <td>${esc(t.assignee || '—')}</td>
          <td>${esc(t.priority || '—')}</td>
          <td>${statusBadge(t.status)}</td><td>${fmtDate(t.due || t.deadline)}</td></tr>`).join('')
        : `<tr><td colspan="6"><div class="empty"><div class="big">📌</div>
           暂无协同任务<br><span style="font-size:12.5px;color:var(--muted)">提示: 运行命令行 <code style="background:var(--bg3);padding:2px 6px;border-radius:4px">longshun.exe dispatch</code> 可按业务分派任务并生成 data/tasks.json</span>
           <br><br><button class="btn" onclick="dispatchHint()">如何生成任务?</button></div></td></tr>`}
      </tbody></table>
    </div>
  </div>`;
}
function dispatchHint() { toast('在终端执行: longshun.exe dispatch', 'ok'); }

/* ================= 状态同步 ================= */
async function renderSync(c) {
  const [sync, rooms] = await Promise.all([API.get('/api/sync'), API.get('/api/rooms')]);
  const mt = sync.maintenance || [], inv = sync.inventory || [];
  // 维修中的房间
  const mtRooms = new Set(mt.map(m => String(m.room_no)));
  c.innerHTML = `
  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h3>🔧 维修工单 <span style="color:var(--muted);font-size:12px">(共 ${mt.length} 单)</span></h3><div class="right"><button class="btn sm" onclick="gotoPage('dash')">看板房态 →</button></div></div>
      <div class="panel-body flush">
        <table><thead><tr><th>房间号</th><th>故障描述</th><th>提交日期</th><th>联动房态</th></tr></thead>
        <tbody>
          ${mt.length ? mt.map(m => {
            const r = rooms.find(x => x.no === String(m.room_no));
            const syncSt = r ? (r.status === 'maintenance' ? '<span class="badge red">已置维修</span>' : '<span class="badge orange">未同步</span>') : '<span class="badge gray">无此房号</span>';
            return `<tr><td class="num">${esc(m.room_no)}</td><td>${esc(m.fault)}</td><td>${esc(m.submit_date)}</td><td>${syncSt}</td></tr>`;
          }).join('') : `<tr><td colspan="4"><div class="empty"><div class="big">🔧</div>暂无维修工单</div></td></tr>`}
        </tbody></table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>📦 库存物资 <span style="color:var(--muted);font-size:12px">(共 ${inv.length} 项)</span></h3></div>
      <div class="panel-body flush">
        <table><thead><tr><th>物资</th><th>数量</th><th>单位</th><th>来源</th></tr></thead>
        <tbody>
          ${inv.length ? inv.map(i => `<tr><td>${esc(i.name)}</td><td class="num">${esc(i.qty)}</td><td>${esc(i.unit || '')}</td>
            <td>${i.updated_at === 'sync' ? '<span class="badge green">同步</span>' : '<span class="badge gray">存量</span>'}</td></tr>`).join('')
          : `<tr><td colspan="4"><div class="empty"><div class="big">📦</div>暂无库存数据</div></td></tr>`}
        </tbody></table>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>🔗 联动同步机制</h3></div>
    <div class="panel-body">
      <div class="flow-step"><div class="step-ic">🔧</div><div>
        <div class="step-t">维修 → 房态</div>
        <div class="step-d">执行 <code>longshun.exe sync maintenance</code> 将维修工单的房间号在 data/rooms.json 中置为 maintenance 状态, 从可售房池自动剔除。</div>
      </div></div>
      <div class="flow-step"><div class="step-ic">🛒</div><div>
        <div class="step-t">采购 → 库存</div>
        <div class="step-d">执行 <code>longshun.exe sync purchase</code> 将采购订单入库并累加到 data/inventory.json, 库存记录带「同步」标记。</div>
      </div></div>
      <div class="flow-step"><div class="step-ic">💳</div><div>
        <div class="step-t">支付 → 预订</div>
        <div class="step-d">支付成功后, 对应预订状态自动从「待支付」更新为「已支付」, 全程可追溯。去 <a style="color:var(--blue);cursor:pointer" onclick="gotoPage('pay')">支付管理 →</a> 发起模拟支付验证联动。</div>
      </div></div>
    </div>
  </div>`;
}

/* ================= 开票支持 ================= */
async function renderInvoice(c) {
  const rows = await API.get('/api/invoice');
  const typeMap = { general: '一般纳税人', small: '小规模纳税人' };
  const indMap = { hotel: '酒店住宿', catering: '餐饮服务', meeting: '会议会展', goods: '商贸货物', service: '企业管理服务' };
  c.innerHTML = `
  <div class="panel">
    <div class="panel-head"><h3>🧾 开票主体 <span style="color:var(--muted);font-size:12px">(共 ${rows.length} 个)</span></h3>
      <div class="right"><span class="badge gray">data/company_licenses.json</span></div></div>
    <div class="panel-body">
      <div class="venue-grid">
        ${rows.length ? rows.map(x => `
        <div class="venue">
          <div class="v-name"><span>${esc(x.company)}</span><span class="v-price">${(x.rate * 100).toFixed(0)}<small>% 税率</small></span></div>
          <div class="v-area">${esc(typeMap[x.taxpayer_type] || x.taxpayer_type)} · ${esc(indMap[x.industry] || x.industry)}</div>
          <div class="v-meta">
            <span class="badge ${x.enabled ? 'green' : 'gray'}">${x.enabled ? '启用' : '停用'}</span>
            <span class="badge ${x.annual_limit ? 'blue' : 'gray'}">${x.annual_limit ? '年度限额 ' + x.annual_limit + ' 万' : '无限额'}</span>
          </div>
        </div>`).join('') : `<div class="empty" style="grid-column:1/-1"><div class="big">🧾</div>暂无开票主体</div>`}
      </div>
    </div>
  </div>`;
}

/* ================= 初始化 ================= */
buildNav();
render();
setInterval(() => { if (cur === 'dash') render(); }, 15000);
</script>
</body>
</html>
