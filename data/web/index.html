<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙顺庄园 · 运营管理控制台</title>
<style>
  :root {
    /* 现代研学蓝白 + 党政红金融合风 */
    --bg: #f0f5fb;            /* 浅蓝白底（参考图左侧） */
    --bg2: #ffffff;           /* 卡片纯白 */
    --bg3: #eaf1f9;           /* 浅蓝灰输入/次要区 */
    --border: #dce4ef;        /* 淡蓝边框 */
    --text: #1a2332;          /* 深墨文字 */
    --muted: #6b7a8f;         /* 蓝灰辅助 */
    --blue: #3B7DD8;          /* 研学蓝主色（PART 3 同款） */
    --blue-light: #5A9BE8;
    --blue-pale: rgba(59,125,216,.10);
    --red: #c8102e;           /* 党政红（印章/主按钮） */
    --red-dark: #a00d24;
    --gold: #b8924a;          /* 暗金点缀 */
    --gold2: #c9a063;
    --green: #2e8b57;
    --orange: #c97a00;
    --purple: #6f42c1;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    --sidebar-w: 224px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--text); font-size: 14px; line-height: 1.6;
    min-height: 100vh;
    /* 参考图风格：白→浅蓝渐变底 + 大圆装饰 */
    background:
      radial-gradient(ellipse 520px 420px at calc(100% - 80px) 60px, rgba(59,125,216,.12), transparent 70%),
      radial-gradient(ellipse 380px 340px at 120px calc(100% - 140px), rgba(90,155,232,.09), transparent 70%),
      linear-gradient(175deg, #ffffff 0%, #eef4fc 40%, #f0f5fb 100%);
  }
  .serif, .logo .name, .topbar h1, .panel-head h3, .vhead h3, .combo-group { font-family: var(--serif); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #bccbd9; border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===== 布局 ===== */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: #ffffff;
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
    box-shadow: 1px 0 8px rgba(59,125,216,.06);
  }
  .logo {
    padding: 20px 18px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .logo .seal {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, #c8102e, #8a0a1e);
    border: 1px solid rgba(201,160,99,.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #f3e2b5;
    box-shadow: inset 0 0 0 1px rgba(243,226,181,.15);
  }
  .logo .name { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .logo .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
  nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    color: var(--muted); text-decoration: none; border-radius: 8px;
    margin-bottom: 2px; cursor: pointer; transition: all .15s;
    font-size: 13.5px; border: 1px solid transparent;
  }
  nav a:hover { color: var(--blue); background: var(--blue-pale); }
  nav a.active {
    color: var(--blue); background: rgba(59,125,216,.10);
    border-color: rgba(59,125,216,.35);
    font-weight: 600;
  }
  nav a .ic { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; }
  nav .section { font-size: 11px; color: #9aa8bc; padding: 14px 12px 6px; letter-spacing: 2px; }
  .side-foot { padding: 14px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .side-foot .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .main { flex: 1; margin-left: var(--sidebar-w); padding: 24px 28px 60px; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; gap: 16px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 24px; font-weight: 800; color: var(--blue); letter-spacing: .5px; line-height: 1.25; }
  /* 参考图 PART 3 风格：大蓝字标题 */
  .topbar .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .toolbar { display: flex; align-items: center; gap: 10px; }
  .btn {
    background: var(--bg3); color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn.gold { background: linear-gradient(135deg, #c8102e, #a00d24); color: #fff; font-weight: 600; border: none; box-shadow: 0 2px 8px rgba(200,16,46,.22); }
  .btn.gold:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn.green { background: rgba(63,185,80,.15); color: var(--green); border-color: rgba(63,185,80,.4); }
  .btn.red { background: rgba(248,81,73,.12); color: var(--red); border-color: rgba(248,81,73,.4); }
  .btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

  .page { display: none; }
  .page.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ===== 卡片 ===== */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat {
    background: #ffffff; border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; position: relative; overflow: hidden;
    box-shadow: 0 2px 8px rgba(59,125,216,.06);
  }
  .stat::before { content:""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--blue), rgba(59,125,216,.15)); }
  .stat .label { color: var(--muted); font-size: 12.5px; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: .5px; }
  .stat .value small { font-size: 14px; font-weight: 400; color: var(--muted); }
  .stat .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .stat.clickable { cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .stat.clickable:hover { border-color: var(--blue-light); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,125,216,.12); }
  .stat.clickable .label { display: flex; justify-content: space-between; align-items: center; }
  .stat.clickable .label::after { content: "→"; font-size: 13px; color: var(--muted); }
  .stat.green .value { color: var(--green); }
  .stat.gold .value { color: var(--gold2); }
  .stat.blue .value { color: var(--blue); }
  .stat.purple .value { color: var(--purple); }

  .panel {
    background: #ffffff; border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 20px; overflow: hidden; box-shadow: 0 1px 6px rgba(59,125,216,.05);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .panel-head h3 { font-size: 15px; font-weight: 600; }
  .panel-head .right { display: flex; gap: 8px; align-items: center; }
  .panel-body { padding: 18px; }
  .panel-body.flush { padding: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px;
    padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap;
    background: #f5f9ff; }
  td { padding: 10px 14px; border-bottom: 1px solid #eef2f7; vertical-align: middle; }
  tr:hover td { background: rgba(59,125,216,.04); }
  .num { font-variant-numeric: tabular-nums; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px;
    background: var(--bg3); border: 1px solid var(--border); white-space: nowrap; }
  .badge.green { color: var(--green); background: rgba(63,185,80,.12); border-color: rgba(63,185,80,.35); }
  .badge.red { color: var(--red); background: rgba(248,81,73,.12); border-color: rgba(248,81,73,.35); }
  .badge.gold { color: var(--gold2); background: rgba(212,175,55,.12); border-color: rgba(212,175,55,.35); }
  .badge.blue { color: var(--blue); background: rgba(88,166,255,.12); border-color: rgba(88,166,255,.35); }
  .badge.orange { color: var(--orange); background: rgba(210,153,34,.12); border-color: rgba(210,153,34,.35); }
  .badge.gray { color: var(--muted); }

  .bar-wrap { display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--blue), var(--blue-light)); }
  .bar > i.green { background: var(--green); }
  .bar > i.red { background: var(--red); }
  .bar > i.orange { background: var(--orange); }

  /* ===== 会场卡片 ===== */
  .venue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .venue {
    background: #ffffff; border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; transition: border-color .15s, box-shadow .15s; box-shadow: 0 1px 6px rgba(59,125,216,.05);
  }
  .venue:hover { border-color: var(--blue-light); box-shadow: 0 4px 16px rgba(59,125,216,.10); }
  .venue .v-name { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .venue .v-area { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .venue .v-price { color: var(--gold2); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .venue .v-price small { font-size: 11px; color: var(--muted); font-weight: 400; }
  .venue .v-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .venue .v-notes { color: var(--muted); font-size: 12.5px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .venue .v-actions { display: flex; gap: 8px; margin-top: 12px; }

  /* ===== 线索卡片 ===== */
  .lead-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .lead {
    background: #ffffff; border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    border-left: 3px solid var(--blue); box-shadow: 0 1px 6px rgba(59,125,216,.05);
  }
  .lead .l-company { font-weight: 600; font-size: 14.5px; }
  .lead .l-line { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .lead .l-line b { color: var(--text); font-weight: 500; }
  .lead .l-tags { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .lead .l-actions { margin-top: 12px; display: flex; gap: 8px; }

  .quick-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: linear-gradient(135deg, rgba(59,125,216,.07), rgba(90,155,232,.05));
    border: 1px solid rgba(59,125,216,.25); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 20px; font-size: 13.5px; animation: fade .3s;
  }
  .quick-banner .qb-t { color: var(--text); font-weight: 500; }
  .quick-banner .qb-x { cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 6px; }
  .quick-banner .qb-x:hover { color: var(--text); }

  /* ===== 表单 ===== */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .field label { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 13.5px; outline: none;
    transition: border-color .15s; font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,125,216,.10); }
  .field textarea { resize: vertical; min-height: 70px; }
  .form-actions { display: flex; gap: 10px; margin-top: 18px; }

  /* ===== Toast ===== */
  #toast {
    position: fixed; top: 20px; right: 24px; z-index: 200; display: flex;
    flex-direction: column; gap: 10px;
  }
  .toast {
    background: var(--bg3); border: 1px solid var(--border); border-left: 3px solid var(--blue);
    border-radius: 10px; padding: 12px 16px; font-size: 13.5px; min-width: 240px;
    box-shadow: 0 8px 28px rgba(59,125,216,.14); animation: slideIn .25s ease;
  }
  .toast.ok { border-left-color: var(--green); }
  .toast.err { border-left-color: var(--red); }
  .toast .act { margin-left: 12px; flex-shrink: 0; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .empty .big { font-size: 40px; margin-bottom: 10px; opacity: .5; }

  .flex { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 200px; }

  .quote-result {
    background: linear-gradient(135deg, rgba(59,125,216,.06), transparent);
    border: 1px solid rgba(59,125,216,.28); border-radius: 14px; padding: 18px;
    margin-top: 16px; display: none;
  }
  .quote-result.show { display: block; animation: fade .3s; }
  .quote-result .total { font-size: 32px; font-weight: 800; color: var(--blue); }
  .quote-result .total small { font-size: 15px; font-weight: 400; color: var(--muted); }
  .quote-result .items { margin-top: 10px; font-size: 13px; color: var(--muted); }

  .mini-tabs { display: inline-flex; background: var(--bg3); border-radius: 8px; padding: 3px; gap: 2px; }
  .mini-tabs button {
    border: none; background: transparent; color: var(--muted); padding: 5px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .mini-tabs button.on { background: var(--blue); color: #fff; font-weight: 600; }

  /* ===== 按日期组合预订 ===== */
  .combo-group { color: var(--blue); font-weight: 600; font-size: 13px; margin: 18px 0 8px; letter-spacing: 1px; }
  .combo-group:first-child { margin-top: 0; }
  .combo-item {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    transition: border-color .15s, background .15s;
  }
  .combo-item .cn-days { flex-shrink: 0; font-size: 12px; color: var(--blue); background: rgba(59,125,216,.09); border: 1px dashed rgba(59,125,216,.35); border-radius: 20px; padding: 4px 10px; font-weight: 600; }
  .combo-item:has(.cb:checked) { border-color: var(--blue-light); background: rgba(59,125,216,.04); }
  .combo-item .cb { width: 16px; height: 16px; accent-color: var(--blue); flex-shrink: 0; cursor: pointer; }
  .combo-item .ci { flex: 1; min-width: 0; }
  .combo-item .ci .t { font-size: 13.5px; font-weight: 600; }
  .combo-item .ci .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .combo-item .cn { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .combo-item .cn input, .combo-item .cn select {
    width: 64px; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; outline: none; font-family: inherit;
  }
  .combo-item .cn input[type="date"] { width: 132px; }
  .combo-item .cn input:focus, .combo-item .cn select:focus { border-color: var(--blue); }
  .combo-item .amt { width: 96px; text-align: right; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  @media (max-width: 720px) { .combo-item { flex-wrap: wrap; } .combo-item .amt { width: auto; } }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 1000px) { .grid-2 { grid-template-columns: 1fr; } }

  /* ===== 手机端适配 (≤768px) ===== */
  @media (max-width: 768px) {
    html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .app { display: block; }
    .sidebar {
      position: sticky; top: 0; width: 100%; height: auto; z-index: 200;
      flex-direction: column; align-items: stretch; border-right: none;
      border-bottom: 1px solid var(--border); padding: 0; overflow: visible;
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(59,125,216,.08);
    }
    .logo { padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .logo .seal { width: 32px; height: 32px; border-radius: 8px; font-size: 16px; }
    .logo .name { font-size: 14px; }
    .logo .sub { display: none; }
    nav { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; overflow: visible; }
    nav .section { display: none; }
    nav a {
      flex: 1 1 auto; justify-content: center; text-align: center;
      padding: 9px 10px; font-size: 13px; white-space: nowrap; margin-bottom: 0;
      border: 1px solid transparent; border-radius: 8px;
    }
    nav a .ic { width: auto; margin-right: 4px; }
    nav a.active { border-color: var(--blue-light); background: rgba(59,125,216,.09); color: var(--blue); }
    .side-foot { display: none; }
    .main { margin-left: 0; padding: 14px 14px 96px; }
    .topbar { margin-bottom: 14px; }
    .topbar h1 { font-size: 18px; }
    .toolbar { width: 100%; flex-wrap: wrap; }
    .toolbar .btn { flex: 1 1 auto; justify-content: center; }
    .cards { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { padding: 12px 14px; }
    .stat .value { font-size: 20px; }
    .stat .label { font-size: 11.5px; }
    .venue-grid, .lead-grid { grid-template-columns: 1fr; }
    .panel-body { padding: 14px; }
    .panel-head { padding: 12px 14px; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    /* 语音弹窗全屏 */
    .vmodal { padding: 0; align-items: stretch; }
    .vbox {
      width: 100%; max-width: none; max-height: 100%; height: 100%; border-radius: 0;
      padding: 16px 16px 20px; display: flex; flex-direction: column;
    }
    .vhead { flex-shrink: 0; }
    .vchat { max-height: none; flex: 1; min-height: 0; }
    .vbar { position: sticky; bottom: 0; gap: 8px; padding-top: 8px; flex-shrink: 0; }
    .vinput { padding: 13px 14px; font-size: 16px; }   /* 16px 防止 iOS 聚焦缩放 */
    .vmic, .vbtn-send { padding: 12px 16px; font-size: 15px; }
  }
  @media (max-width: 420px) {
    .cards { grid-template-columns: 1fr; }
    .toolbar .btn { flex-basis: 100%; }
  }
  .kpi-row { display: flex; gap: 12px; align-items: baseline; margin-top: 4px; }
  .kpi-row .k { color: var(--muted); font-size: 12px; }
  .kpi-row .v { font-size: 15px; font-weight: 600; }

  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }

  .flow-step { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px dashed var(--border); }
  .flow-step:last-child { border-bottom: none; }
  .flow-step .step-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--bg3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
  .flow-step .step-t { font-size: 13.5px; font-weight: 600; }
  .flow-step .step-d { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  /* ===== 语音助手对话框 ===== */
  .vmodal {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(26,35,50,.4); align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
  }
  .vmodal.show { display: flex; }
  .vbox {
    width: min(580px, 92vw); max-height: 88vh; overflow-y: auto;
    background: #ffffff; border: 1px solid var(--border); border-radius: 18px;
    padding: 22px 24px; box-shadow: 0 20px 70px rgba(59,125,216,.15); animation: vpop .2s ease;
  }
  @keyframes vpop { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .vhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .vhead h3 { font-size: 16px; }
  .vclose { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 4px; }
  .vclose:hover { color: var(--text); }
  .vhead-right { display: flex; align-items: center; gap: 6px; }
  .vtts { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 3px 8px; cursor: pointer; font-size: 14px; line-height: 1; }
  .vtts:hover { color: var(--blue); border-color: var(--blue); }
  .vchat {
    display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
    max-height: 44vh; min-height: 220px; padding: 12px 2px 4px; scroll-behavior: smooth;
  }
  .vplan {
    border: 1px dashed var(--blue-light); border-radius: 12px; background: rgba(59,125,216,.04);
    padding: 10px 12px; margin-top: 10px;
  }
  .vplan-h { font-size: 12.5px; font-weight: 600; color: var(--blue); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .vplan .vgrid { margin-top: 0; }
  .vmsg { display: flex; align-items: flex-end; gap: 8px; }
  .vmsg.me { flex-direction: row-reverse; }
  .vava {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
    background: var(--bg3); border: 1px solid var(--border); color: var(--muted); user-select: none;
  }
  .vballoon {
    max-width: 80%; padding: 9px 12px; font-size: 13.5px; line-height: 1.65;
    border-radius: 12px; word-break: break-word;
  }
  .vmsg.ai .vballoon { background: var(--bg3); border: 1px solid var(--border); border-top-left-radius: 3px; }
  .vmsg.me .vballoon {
    background: linear-gradient(135deg, var(--blue), var(--blue-light)); color: #fff;
    border-top-right-radius: 3px; box-shadow: 0 2px 10px rgba(59,125,216,.22);
  }
  .vmsg .vq { font-weight: 600; color: var(--blue); line-height: 1.6; }
  .vmsg.me .vq { color: #fff; }
  .vmini { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .vopts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .vopts .vchip {
    background: rgba(59,125,216,.07); border-color: rgba(59,125,216,.30);
    color: var(--blue); font-size: 12.5px; padding: 5px 13px;
  }
  .vopts .vchip:hover { background: rgba(59,125,216,.14); border-color: var(--blue); color: #2a5ca0; }
  .vtyping { display: inline-flex; gap: 5px; padding: 6px 4px; }
  .vtyping i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: vty 1.2s infinite; }
  .vtyping i:nth-child(2) { animation-delay: .2s; }
  .vtyping i:nth-child(3) { animation-delay: .4s; }
  @keyframes vty { 0%, 100% { opacity: .3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
  .vbar { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .vbar .vinput { flex: 1; margin-top: 0; }
  .vmic {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    border: 1.5px solid var(--border); background: var(--bg3); color: var(--muted);
    cursor: pointer; transition: all .2s; user-select: none;
  }
  .vmic:hover { border-color: var(--blue); color: var(--blue); }
  .vmic.on { border-color: var(--red); background: rgba(248, 81, 73, .12); color: var(--red); animation: micpulse 1.2s infinite; }
  @keyframes micpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, .35); } 50% { box-shadow: 0 0 0 12px rgba(248, 81, 73, 0); } }
  .vbtn-send { flex: 0 0 auto; height: 42px; padding: 0 16px; border-radius: 10px; }
  .vstatus { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 9px; min-height: 17px; }
  .vinput {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 11px 12px; font-size: 14px; outline: none;
  }
  .vinput:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,125,216,.10); }
  .vchips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .vchip {
    background: var(--bg3); border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; padding: 4px 12px; border-radius: 20px; cursor: pointer; transition: all .15s;
  }
  .vchip:hover { color: var(--blue); border-color: var(--blue); }
  .vgrid { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .vcard { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .vcard .vt { font-size: 13px; font-weight: 600; color: var(--blue); line-height: 1.45; }
  .vcard .vs { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .vcard .vp { font-size: 15px; font-weight: 700; color: var(--green); margin-top: 6px; }
  .vtable-wrap { margin-top: 14px; max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  .vtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .vtable th { background: var(--bg3); color: var(--muted); text-align: left; padding: 8px 10px; position: sticky; top: 0; white-space: nowrap; }
  .vtable td { padding: 7px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
  .vtable tbody tr:hover { background: rgba(59,125,216,.05); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="seal">龙</div>
      <div>
        <div class="name">龙顺庄园</div>
        <div class="sub">运营管理控制台</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot"><span class="dot"></span>服务在线 · v1.0</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">数据看板</h1>
        <div class="sub" id="pageSub">实时运营概览</div>
      </div>
      <div class="toolbar">
        <button class="btn" onclick="refreshAll()">⟳ 刷新全部</button>
        <button class="btn" onclick="openVoice()">🎤 语音助手</button>
        <button class="btn" onclick="gotoPage('booking')">＋ 新建预订</button>
        <button class="btn gold" onclick="gotoPage('quote')">💡 智能报价</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="toast"></div>

<!-- 语音助手对话框: 微信式聊天 + 电话一问一答 -->
<div class="vmodal" id="voiceModal">
  <div class="vbox">
    <div class="vhead">
      <h3>🎤 语音助手 <span class="vmini" style="margin:0">💬 聊天 · 📞 电话问答</span></h3>
      <div class="vhead-right">
        <button class="vtts" id="vTtsBtn" onclick="toggleTTS()" title="语音播报开关">🔊</button>
        <button class="vclose" onclick="closeVoice()" title="关闭(Esc)">✕</button>
      </div>
    </div>
    <div class="vchat" id="vChat"></div>
    <div class="vplan" id="vPlan" style="display:none"></div>
    <div class="vchips" id="vChips"></div>
    <div class="vbar">
      <input class="vinput" id="vInput" placeholder="点击 🎤 用输入法语音说话，说完自动发送；也可直接打字" onkeydown="if(event.key==='Enter'&&!event.isComposing)sendVoice()" oninput="onVInput(event)" oncompositionend="onVInput(event)">
      <button class="vmic" id="vMic" onclick="toggleVoice()" title="点击用输入法语音说话 / 停止">🎤</button>
      <button class="btn gold vbtn-send" onclick="sendVoice()">发送</button>
    </div>
    <div class="vstatus" id="vStatus"></div>
  </div>
</div>

<script>
/* ================= 基础 ================= */
const API = {
  get: (u) => fetch(u).then(r => r.json()),
  post: (u, body) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json()),
};

function toast(msg, type = '') {
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2600);
}
function toastAction(msg, label, fn, type = 'ok') {
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${esc(msg)}</span><button class="btn gold sm act">${esc(label)}</button>`;
  el.querySelector('button').onclick = () => { el.remove(); fn(); };
  box.appendChild(el);
  setTimeout(() => { if (el.isConnected) { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); } }, 6000);
}
function money(v) { return '¥' + Number(v || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDate(s) { return s ? String(s).slice(0, 16) : '-'; }
function addDaysISO(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function minutesBetween(a, b) {
  const p = s => { const [h, m] = String(s).split(':').map(Number); return (h || 0) * 60 + (m || 0); };
  let d = p(b) - p(a);
  if (d <= 0) d += 1440; // 跨天
  return d;
}
function quoteVenueHours() {
  const st = document.getElementById('qVenueStart');
  const en = document.getElementById('qVenueEnd');
  const t = document.getElementById('qVenueHoursText');
  if (!st || !en || !t) return;
  if (!st.value || !en.value) { t.value = '0 小时'; return; }
  const m = minutesBetween(st.value, en.value);
  const h = Math.round(m / 60 * 100) / 100;
  t.value = h + ' 小时';
}
function comboNights(el) {
  const cin = el.querySelector('.cin'); const cout = el.querySelector('.cout');
  if (!cin || !cout || !cin.value || !cout.value) return 1;
  const n = daysBetween(cin.value, cout.value);
  return n >= 1 ? n : 1;
}

const PAGES = [
  { id: 'dash',   ic: '📊', name: '数据看板', section: '经营总览' },
  { id: 'rooms',  ic: '🛏️', name: '客房报价', section: '产品定价' },
  { id: 'venues', ic: '🏛️', name: '会场报价', section: '产品定价' },
  { id: 'quote',  ic: '💡', name: '智能报价', section: '产品定价' },
  { id: 'booking',ic: '📝', name: '在线预订', section: '业务运营' },
  { id: 'pay',    ic: '💳', name: '支付管理', section: '业务运营' },
  { id: 'leads',  ic: '🎯', name: '客户线索', section: '销售管理' },
  { id: 'tasks',  ic: '✅', name: '任务协同', section: '销售管理' },
  { id: 'sync',   ic: '🔄', name: '状态同步', section: '后台管理' },
  { id: 'invoice',ic: '🧾', name: '开票支持', section: '后台管理' },
];
const TITLES = {
  dash: '数据看板', rooms: '客房报价', venues: '会场报价', quote: '智能报价',
  booking: '在线预订', pay: '支付管理', leads: '客户线索', tasks: '任务协同',
  sync: '状态同步', invoice: '开票支持',
};
const SUBS = {
  dash: '订单 / 房态 / 利润 / 线索实时聚合',
  rooms: '庭院小院 · 商务楼 全品类价格体系',
  venues: '宴会厅 / 会议室 / 贵宾厅 场地资源',
  quote: '选择产品与时段, 一键试算预估费用',
  booking: '在线创建客房 / 会场预订',
  pay: '支付单跟踪 · 模拟支付 · 微信支付对接',
  leads: '公开渠道采集的潜在客户线索',
  tasks: '跨模块协同任务分派与追踪',
  sync: '维修→房态 / 采购→库存 联动同步',
  invoice: '开票主体 · 税率 · 类型维护',
};

let cur = 'dash';
let navState = null;
function buildNav() {
  const nav = document.getElementById('nav');
  let lastSection = '';
  nav.innerHTML = PAGES.map(p => {
    let s = '';
    if (p.section !== lastSection) { s = `<div class="section">${p.section}</div>`; lastSection = p.section; }
    return s + `<a data-p="${p.id}" class="${p.id === cur ? 'active' : ''}" onclick="gotoPage('${p.id}')"><span class="ic">${p.ic}</span>${p.name}</a>`;
  }).join('');
}
function gotoPage(id, params) {
  navState = params || null;
  cur = id;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.p === id));
  document.getElementById('pageTitle').textContent = TITLES[id];
  document.getElementById('pageSub').textContent = SUBS[id];
  render();
  window.scrollTo(0, 0);
}
function refreshAll() { render(); }
function clearQuick() { render(); }

async function render() {
  const c = document.getElementById('content');
  const st = navState; navState = null;   // 一次性消费跨页参数
  try {
    if (cur === 'dash') await renderDash(c, st);
    else if (cur === 'rooms') await renderRooms(c, st);
    else if (cur === 'venues') await renderVenues(c, st);
    else if (cur === 'quote') renderQuote(c, st);
    else if (cur === 'booking') await renderBooking(c, st);
    else if (cur === 'pay') await renderPay(c, st);
    else if (cur === 'leads') await renderLeads(c, st);
    else if (cur === 'tasks') await renderTasks(c, st);
    else if (cur === 'sync') await renderSync(c, st);
    else if (cur === 'invoice') await renderInvoice(c, st);
  } catch (e) {
    c.innerHTML = `<div class="panel"><div class="empty"><div class="big">⚠️</div>数据加载失败: ${esc(e.message)}<br><br><button class="btn" onclick="refreshAll()">重试</button></div></div>`;
  }
}

/* ================= 数据看板 ================= */
async function renderDash(c) {
  const [dash, orders, rooms] = await Promise.all([API.get('/api/dashboard'), API.get('/api/orders'), API.get('/api/rooms')]);
  const o = dash.orders || {}, r = dash.rooms || {};
  const occ = Number(r.occupancy_rate || 0);
  const roomCount = rooms.length;
  const st = {};
  rooms.forEach(x => st[x.status] = (st[x.status] || 0) + 1);

  c.innerHTML = `
  <div class="cards">
    <div class="stat gold clickable" onclick="gotoPage('pay')"><div class="label">累计订单</div><div class="value">${o.count || 0}<small> 笔</small></div><div class="hint">营收 ${money(o.total_amount)}</div></div>
    <div class="stat clickable" onclick="gotoPage('booking')"><div class="label">累计营收</div><div class="value">${money(o.total_amount)}</div><div class="hint">成本 ${money(o.total_cost)}</div></div>
    <div class="stat green clickable" onclick="gotoPage('booking')"><div class="label">累计毛利</div><div class="value">${money(o.profit)}</div><div class="hint">营收 - 成本</div></div>
    <div class="stat blue clickable" onclick="gotoPage('sync')"><div class="label">房间总数</div><div class="value">${r.total || 0}<small> 间</small></div><div class="hint">房态明细 ${roomCount} 条</div></div>
    <div class="stat clickable" onclick="gotoPage('sync')"><div class="label">综合占用率</div><div class="value">${occ.toFixed(1)}<small> %</small></div>
      <div class="hint">入住 ${r.occupied || 0} · 维修 ${r.maintenance || 0}</div></div>
    <div class="stat purple clickable" onclick="gotoPage('leads')"><div class="label">客户线索</div><div class="value">${dash.leads_count || 0}<small> 条</small></div><div class="hint">定价条目 ${dash.room_pricing_count || 0}+${dash.venue_pricing_count || 0}</div></div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h3>🏨 房态分布</h3><div class="right"><button class="btn sm" onclick="gotoPage('sync')">房态联动 →</button></div></div>
      <div class="panel-body">
        ${[['available','可售',st.available||0,'green'],['occupied','入住',st.occupied||0,'gold'],['maintenance','维修',st.maintenance||0,'red']].map(([k,l,v,color]) => `
          <div style="margin-bottom:14px">
            <div class="bar-wrap"><span style="width:44px;color:var(--muted)">${l}</span>
            <div class="bar"><i class="${color}" style="width:${roomCount ? (v/roomCount*100) : 0}%"></i></div>
            <span class="num" style="width:40px;text-align:right">${v}</span></div>
          </div>`).join('')}
        <div class="legend"><span><i style="background:var(--green)"></i>可售</span><span><i style="background:var(--gold)"></i>入住</span><span><i style="background:var(--red)"></i>维修</span></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>🤖 智能问数</h3><div class="right"><button class="btn sm" onclick="askQ()">提问</button></div></div>
      <div class="panel-body">
        <div class="field"><input id="qInput" placeholder="例如: 今天订单多少 / 房态如何 / 利润多少 / 线索 / 客房报价 / 会场" onkeydown="if(event.key==='Enter')askQ()"></div>
        <div id="qAnswer" style="margin-top:12px;font-size:13.5px;color:var(--muted)"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>📦 订单明细</h3><div class="right"><span class="badge gray">数据源 data/orders.json</span></div></div>
    <div class="panel-body flush">
      <table><thead><tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th><th>日期</th><th>操作</th></tr></thead>
      <tbody>
        ${orders.length ? orders.map(x => `<tr><td class="num">${esc(x.id)}</td><td>${esc(x.customer)}</td><td class="num">${money(x.amount)}</td>
          <td>${statusBadge(x.status)}</td><td>${fmtDate(x.date)}</td>
          <td>${(x.status === 'pending' || !x.status) ? `<button class="btn gold sm" onclick="gotoPage('pay',{order_id:'${esc(x.id)}',amount:${Number(x.amount)||0},auto_create:true,subject:'预订订单'})">去支付</button>` : '<span class="badge gray">—</span>'}</td></tr>`).join('')
        : `<tr><td colspan="6"><div class="empty"><div class="big">📭</div>暂无订单数据</div></td></tr>`}
      </tbody></table>
    </div>
  </div>
  <div style="text-align:center;color:var(--muted);font-size:12px">汇总生成于 ${fmtDate(dash.generated_at)}</div>`;
}

async function askQ() {
  const q = document.getElementById('qInput').value.trim();
  if (!q) { toast('请输入问题', 'err'); return; }
  const r = await API.get('/api/query?q=' + encodeURIComponent(q));
  document.getElementById('qAnswer').innerHTML = `<span class="badge blue">回答</span> ${esc(r.answer)}`;
}

/* ================= 语音助手 ================= */
const V_CHIPS = ['帮我订一间大床房', '帮我订个会场', '今天订单多少', '房态如何', '待支付订单有哪些', '打开数据看板'];
const PARAM_CN = {
  date: '日期', cust_type: '客户类型', room_type: '房间种类', category: '早餐类型',
  nights: '晚数', rooms: '间数',
  venue_id: '会场', people: '人数', layout: '布局', need_equip: '备注设备',
  is_full_day: '时长', hours: '小时',
  need_rehearsal: '彩排', need_lighting: '灯光', need_screen: '大屏', catering_amount: '用餐'
};
let vListening = false;
let vLastQ = ''; // 最近一次查询词, 供虚拟结账后刷新表格
let vConv = null;      // 多轮对话会话状态
let vAutoSend = false; // 对话引导模式下识别完成后自动发送
let vTts = true;       // 电话播报开关(默认开启, 模拟电话一问一答)

/* ---- 微信式聊天: 消息气泡 ---- */
function addVMsg(role, html) {
  const chat = document.getElementById('vChat');
  const el = document.createElement('div');
  el.className = 'vmsg ' + (role === 'me' ? 'me' : 'ai');
  el.innerHTML = role === 'me'
    ? `<div class="vballoon">${html}</div><div class="vava">我</div>`
    : `<div class="vava">🤖</div><div class="vballoon">${html}</div>`;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}
function vTyping(on) {
  const chat = document.getElementById('vChat');
  let t = document.getElementById('vTyping');
  if (on) {
    if (!t) {
      t = document.createElement('div');
      t.id = 'vTyping';
      t.className = 'vmsg ai';
      t.innerHTML = `<div class="vava">🤖</div><div class="vballoon"><span class="vtyping"><i></i><i></i><i></i></span></div>`;
      chat.appendChild(t);
    }
    chat.scrollTop = chat.scrollHeight;
  } else if (t) { t.remove(); }
}
/* ---- 电话一问一答: 语音播报问题, 播完自动聆听 ---- */
// 解锁浏览器自动播放: 首次用户手势时播放极短静音音频, 后续 audio.play() 才不会被拦截
let vUnlocked = false;
function unlockAudio() {
  if (vUnlocked) return;
  vUnlocked = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      const c = new AC();
      c.resume().catch(() => {});
      const s = c.createBufferSource();
      s.buffer = c.createBuffer(1, 1, 22050);
      s.connect(c.destination);
      s.start(0);
    }
    const a = new Audio();
    a.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    a.play().catch(() => {});
  } catch (e) { /* 解锁失败忽略 */ }
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio, { passive: true });

function speakV(text) {
  return new Promise(res => {
    if (!vTts || !text) { res(); return; }
    text = String(text).replace(/\s+/g, ' ').trim();
    if (!text) { res(); return; }
    try {
      const url = '/api/tts?text=' + encodeURIComponent(text);
      fetch(url).then(r => {
        if (!r.ok) throw new Error('tts http ' + r.status);
        const ct = r.headers.get('content-type') || '';
        if (ct.indexOf('audio') >= 0) return r.blob();
        return r.text().then(() => { throw new Error('not audio'); });
      }).then(blob => {
        const au = new Audio();
        window.__vAudio = au;
        const done = setTimeout(() => { try { au.pause(); } catch (e) {} res(); }, 15000);
        au.onended = () => { clearTimeout(done); try { URL.revokeObjectURL(au.src); } catch (e) {} window.__vAudio = null; res(); };
        au.onerror = () => { clearTimeout(done); window.__vAudio = null; res(); };
        au.src = URL.createObjectURL(blob);
        au.play().catch(() => {
          clearTimeout(done); window.__vAudio = null;
          try { toast('浏览器拦截了自动播放，请点击页面任意处后再试'); } catch (e) {}
          res();
        });
      }).catch(() => {
        // 回退: 浏览器原生语音合成(https 环境可用)
        if (window.speechSynthesis) {
          try {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN'; u.rate = 1.02; u.pitch = 1.02;
            const vs = speechSynthesis.getVoices().find(v => v.lang && v.lang.indexOf('zh') === 0);
            if (vs) u.voice = vs;
            let ended = false;
            const fin = () => { if (!ended) { ended = true; res(); } };
            u.onend = fin; u.onerror = fin;
            speechSynthesis.speak(u);
            setTimeout(fin, 8000);
          } catch (e) { res(); }
        } else { res(); }
      });
    } catch (e) { res(); }
  });
}

/* ===== 讯飞语音听写(WebSocket 流式)识别引擎 =====
   替代浏览器 Web Speech SpeechRecognition(http 下被禁、iOS 不支持):
   - getUserMedia 采集麦克风 → 16k/16bit 单声道 PCM
   - 直连 wss://iat-api.xfyun.cn/v2/iat 流式识别(需 HTTPS 安全上下文)
   - http 访问时 startSpeechVoice 已自动回退"系统输入法语音" */
const XF_APPID = 'e29eeb0a';
const XF_API_KEY = 'baf42e80a1f56da6c9c96fe3ac480dcc';
const XF_API_SECRET = 'MzNmMDRhMjZjMzY0MDM4ODBjYWVmYTVi';
const XF_HOST = 'iat-api.xfyun.cn', XF_PATH = '/v2/iat';
const XF_FATAL = [10005, 10010, 10110, 10404, 11200, 11201, 11202, 11203]; // 授权/配额类错误, 不自动重试

/* 是否具备语音识别条件(HTTPS 安全上下文 + 麦克风/加密 API 可用) */
function hasWebSpeech() {
  return !!(window.isSecureContext && navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia && window.crypto && crypto.subtle);
}

/* HMAC-SHA256 鉴权 → 返回带 authorization 的 wss 连接地址 */
async function xfAuthUrl() {
  const date = new Date().toUTCString();                  // RFC1123 GMT 格式
  const origin = 'host: ' + XF_HOST + '\ndate: ' + date + '\nGET ' + XF_PATH + ' HTTP/1.1';
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(XF_API_SECRET),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = btoa(String.fromCharCode.apply(null,
    new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(origin)))));
  const auth = btoa('api_key="' + XF_API_KEY + '", algorithm="hmac-sha256", ' +
    'headers="host date request-line", signature="' + sig + '"');
  return 'wss://' + XF_HOST + XF_PATH +
    '?authorization=' + encodeURIComponent(auth) +
    '&date=' + encodeURIComponent(date) + '&host=' + XF_HOST;
}

/* Float32(-1~1) → 16bit 小端 PCM 字节 */
function f32ToPcm(f32) {
  const out = new Uint8Array(f32.length * 2), dv = new DataView(out.buffer);
  for (let i = 0; i < f32.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    dv.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return out;
}
function pcmB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* 创建识别控制器: 对外接口 start/stop 与原 SpeechRecognition 一致,
   识别文字实时回显输入框, 说完自动发送; 持续对话时自动循环聆听 */
function buildRecog() {
  if (!hasWebSpeech()) return null;
  const S = { ws:null, ctx:null, node:null, src:null, stream:null, timer:null,
              q:[], first:false, fin:false, text:'' };

  function wsSend(status, bytes) {
    if (!S.ws || S.ws.readyState !== 1) return;
    const f = { data: { status, format: 'audio/L16;rate=16000', encoding: 'raw',
                        audio: bytes && bytes.length ? pcmB64(bytes) : '' } };
    if (status === 0) {
      f.common = { app_id: XF_APPID };
      f.business = { language: 'zh_cn', domain: 'iat', accent: 'mandarin',
                     vad_eos: 3000, ptt: 1 };   // vad_eos: 3s 静音判定说完
    }
    S.ws.send(JSON.stringify(f));
  }

  function cleanup() {                           // 停麦克风并释放资源
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
    if (S.node) { try { S.node.disconnect(); } catch(e){} S.node.onaudioprocess = null; S.node = null; }
    if (S.src) { try { S.src.disconnect(); } catch(e){} S.src = null; }
    if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
    if (S.ctx) { try { S.ctx.close(); } catch(e){} S.ctx = null; }
  }

  function finish() {                            // 本轮识别结束(服务端 status=2 或连接断开)
    const hadText = S.text.trim();
    cleanup();
    if (S.ws) { try { S.ws.close(); } catch(e){} S.ws = null; }
    if (hadText) {
      if (vResponding) return;                   // 已手动发送过, 丢弃避免重复
      const el = document.getElementById('vInput');
      if (el) el.value = hadText;
      setVStatus('🎤 已识别：' + hadText + '，正在发送…');
      sendVoice();                               // 自动发送形成对话(内部置 vResponding)
    } else if (vVoiceActive && !vResponding) {   // 没听到: 节流后自动重新聆听
      const now = Date.now();
      if (now - vLastRestart > 1500) { vLastRestart = now; start(); }
    }
  }

  function pump() {                              // 40ms 定时发帧(1280B/帧, 讯飞建议节奏)
    if (!S.ws || S.ws.readyState !== 1) return;
    const b = S.q.shift();
    if (!b) return;
    wsSend(S.first ? 1 : 0, b);                  // 首块带 common/business(status=0)
    S.first = true;
  }

  function start() {
    if (S.ws) return;                            // 已在识别中
    if (!hasWebSpeech()) { startInputMethodVoice(); return; }
    S.q = []; S.first = false; S.fin = false; S.text = '';
    xfAuthUrl().then(url => {
      const ws = new WebSocket(url);
      S.ws = ws;
      ws.onopen = async () => {
        try {
          S.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          setVStatus('🎤 请允许浏览器使用麦克风，然后点击 🎤 即可自动语音对话');
          try { ws.close(); } catch(e2){}
          S.ws = null;
          return;
        }
        try { S.ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 }); }
        catch (e) { S.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        if (S.ctx.resume) { try { S.ctx.resume(); } catch(e2){} }   // iOS 自动播放策略
        S.src = S.ctx.createMediaStreamSource(S.stream);
        S.node = S.ctx.createScriptProcessor(2048, 1, 1);
        const ratio = S.ctx.sampleRate / 16000;
        S.node.onaudioprocess = (ev) => {
          const inp = ev.inputBuffer.getChannelData(0);
          let f32 = inp;
          if (Math.abs(ratio - 1) > 0.01) {      // 采样率非 16k: 抽取下采样
            const n = Math.floor(inp.length / ratio);
            f32 = new Float32Array(n);
            for (let i = 0; i < n; i++) f32[i] = inp[Math.floor(i * ratio)];
          }
          S.q.push(f32ToPcm(f32));
        };
        S.src.connect(S.node);
        S.node.connect(S.ctx.destination);       // ScriptProcessor 需接 destination 才驱动(Safari); 输出静音不回放
        S.timer = setInterval(pump, 40);
      };
      ws.onmessage = (e) => {
        let j; try { j = JSON.parse(e.data); } catch(_) { return; }
        if (j.code !== 0) {
          setVStatus('⚠️ 语音识别出错(' + j.code + ')：' + (j.message || ''));
          if (XF_FATAL.indexOf(j.code) >= 0) {   // 授权/配额类错误: 停止自动重试
            vVoiceActive = false; setMicUI(false);
          }
          S.fin = true;
          try { ws.close(); } catch(e2){}
          return;
        }
        const d = j.data; if (!d) return;
        if (d.result && d.result.ws) {
          let t = '';
          d.result.ws.forEach(w => w.cw && w.cw.forEach(c => { t += c.w; }));
          if (t) {
            S.text += t;
            if (!vResponding) {
              const el = document.getElementById('vInput');
              if (el) el.value = S.text;         // 实时回显
              setVStatus('🎤 正在聆听，请直接说话，识别后自动发送…');
            }
          }
        }
        if (d.status === 2) { S.fin = true; finish(); }   // 服务端识别完毕
      };
      ws.onerror = () => {};
      ws.onclose = () => {
        S.ws = null;
        if (!S.fin) finish();                    // 异常断开(60s 上限/静音断开等): 按本轮结束处理
      };
    }).catch(err => {
      setVStatus('⚠️ 语音鉴权失败：' + ((err && err.message) || err));
    });
  }

  function stop() {                              // 立即停麦; 已发过音频则发结束帧取回剩余结果
    cleanup();
    if (S.ws && S.ws.readyState === 1) {
      if (S.first) { wsSend(2); }
      else { S.fin = true; try { S.ws.close(); } catch(e){} }
    }
  }

  return { start, stop };
}
/* 启动自动语音对话(讯飞识别需 HTTPS; http 下回退系统输入法语音) */
function startSpeechVoice() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  /* 非安全上下文(http 访问, 如服务器版/手机 http)下浏览器禁用麦克风与加密 API,
     直接走系统输入法语音(说完自动发送), 否则会卡在权限报错无法对话 */
  if (!window.isSecureContext) { startInputMethodVoice(); return; }
  if (!vRecog) vRecog = buildRecog();
  if (!vRecog) { startInputMethodVoice(); return; }   // 兜底: 聚焦输入框提示用输入法语音
  vListening = true;
  setMicUI(true);
  try { vRecog.start(); } catch (_) {}
  setVStatus('🎤 正在聆听，请直接说话，识别后自动发送…');
}
/* 系统输入法语音(网页无法程序化唤起麦克风键盘, 仅聚焦输入框并提示用户点键盘🎤):
   - 进入"自动发送"模式(vAutoSend=true): 用户用输入法说完、文字填入后停顿即自动发送, 形成对话
   - 兼容手机/桌面/服务器的 http 与 https 访问 */
function startInputMethodVoice() {
  const el = document.getElementById('vInput');
  if (el) { el.focus(); }
  vListening = true;
  vAutoSend = true;          // 开启"说完自动发送"
  setMicUI(true);
  setVStatus('🎤 已聚焦输入框：请点键盘上的🎤语音输入说话，识别到文字后会自动发送并继续对话（也可直接打字，“发送”键随时提交）');
}
/* 输入法语音文字填入后, 监听输入停顿在自动发送模式下发送(实现"说完即问") */
function onVInput(e) {
  if (vIMTimer) clearTimeout(vIMTimer);
  if (vResponding) return;                 // AI 正在处理/播报, 不抢发
  if (e && e.isComposing) return;          // 输入法选词组合中, 等 compositionend
  if (vAutoSend) {
    vIMTimer = setTimeout(() => {
      const el = document.getElementById('vInput');
      if (el && el.value.trim()) sendVoice();
    }, 1000);
  }
}
/* AI 播报结束后: 若仍处于语音对话会话, 延迟一小段再恢复聆听, 避免把刚播完的
   TTS 回声识别成输入(防死循环)。 */
function resumeListening() {
  vResponding = false;
  if (!vVoiceActive) { setMicUI(false); return; }
  setMicUI(true);
  if (vRecog) {
    clearTimeout(vResumeTimer);
    vResumeTimer = setTimeout(() => {
      if (!vVoiceActive || vResponding) return;
      try { vRecog.start(); } catch (_) {}
      setVStatus('🎤 正在聆听，请继续说话…');
    }, 600); // 防回声: 待 TTS 声音消散
  } else {
    startInputMethodVoice();
  }
}
function toggleVoice() {
  if (vVoiceActive) {
    vVoiceActive = false;
    stopVoice();
    return;
  }
  vVoiceActive = true;
  vResponding = false;
  vListening = true;
  startSpeechVoice();
}
function stopVoice() {
  if (vIMTimer) { clearTimeout(vIMTimer); vIMTimer = null; }
  if (vResumeTimer) { clearTimeout(vResumeTimer); vResumeTimer = null; }
  vLastRestart = 0;
  vListening = false;
  vVoiceActive = false;
  vResponding = false;
  setMicUI(false);
  if (vRecog) { try { vRecog.stop(); } catch (_) {} }
  setVStatus('语音对话已结束，可输入文字或再次点击 🎤');
}

/* 渲染一轮报价卡片(用于对话气泡内嵌的同步方案) */
function renderPlanCards(cards) {
  if (!Array.isArray(cards) || !cards.length) return '';
  return `<div class="vgrid">${cards.map(it =>
    `<div class="vcard"><div class="vt">${esc(it.title)}</div>` +
    (it.sub ? `<div class="vs">${esc(it.sub)}</div>` : '') +
    (it.price ? `<div class="vp">${esc(it.price)}</div>` : '') +
    `</div>`).join('')}</div>`;
}

/* 侧边/底部同步报价方案板(随对话实时更新) */
function updatePlanBoard(c) {
  const board = document.getElementById('vPlan');
  if (!board) return;
  if (c && Array.isArray(c.cards) && c.cards.length) {
    board.style.display = 'block';
    board.innerHTML =
      `<div class="vplan-h">📋 实时报价方案 <span class="badge blue">随对话更新</span></div>` +
      renderPlanCards(c.cards);
  } else {
    board.style.display = 'none';
    board.innerHTML = '';
  }
}

async function sendVoice() {
  const q = document.getElementById('vInput').value.trim();
  if (!q) { toast('请输入或说出问题', 'err'); return; }
  vLastQ = q;
  vResponding = true; // 进入处理/播报阶段, 暂停语音输入(自动发送模式由 vAutoSend 维持)
  vListening = false;
  if (vRecog) { try { vRecog.stop(); } catch (_) {} } // 立即停掉麦克风, 避免把 AI 播报声当输入
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('vInput').value = '';
  addVMsg('me', esc(q));
  vTyping(true);
  try {
    /* 1) 先尝试多轮对话引导(订房/会场报价等参数收集场景) */
    const payload = { q };
    if (vConv) {
      payload.intent = vConv.intent;
      ['date','cust_type','room_type','category','building','nights','rooms',
       'venue_id','people','layout','need_equip','is_full_day','hours',
       'need_rehearsal','need_lighting','need_screen','catering_amount']
        .forEach(k => { if (vConv[k] != null && vConv[k] !== '') payload[k] = vConv[k]; });
    }
    const c = await API.post('/api/conv', payload);
    vTyping(false);
    if (c && c.conv) {
      if (c.done) {
        if (c.no_match) {
          /* 不可满足: 语音提示并重新询问该参数 */
          vReask(c.retry_param, c.answer);
          return;
        }
        /* 参数收集完毕: 生成报价方案气泡 */
        vConv = null;
        vAutoSend = false;                 // 一轮对话结束, 退出自动发送, 等待用户新指令
        resetVChips();
        updatePlanBoard(c);
        setVStatus('报价方案已生成，可继续提问或点 🎤');
        let g = '';
        if (c.type) {
          window.__vBookParam = buildBookParam(c);
          g = `<button class="btn gold sm" onclick="gotoBookFromQuote()">✓ 去预订下单 →</button>`;
        }
        addVMsg('ai',
          `<div class="vq">📋 报价方案</div>` +
          `<div style="margin-top:4px">${esc(c.answer)}</div>` +
          (c.note ? `<div class="vmini" style="margin-top:6px">💡 ${esc(c.note)}</div>` : '') +
          renderPlanCards(c.cards) +
          `<div class="vopts">${g}<span class="vchip" onclick="vNewQuery()">🔄 重新筛选</span></div>`);
        speakV(c.answer).then(resumeListening);
        return;
      }
      /* 缺参数: 追加提问气泡 + 可选项, 电话模式播报后自动聆听 */
      vConv = { intent: c.intent, date: c.date || '', cust_type: c.cust_type || '',
                room_type: c.room_type || '', category: c.category || '', building: c.building || '',
                nights: c.nights || 0, rooms: c.rooms || 0,
                venue_id: c.venue_id || 0, people: c.people || 0, layout: c.layout || '',
                need_equip: c.need_equip || '',
                is_full_day: (c.is_full_day == null ? -1 : c.is_full_day), hours: c.hours || 0,
                need_rehearsal: c.need_rehearsal == null ? -1 : c.need_rehearsal,
                need_lighting: c.need_lighting == null ? -1 : c.need_lighting,
                need_screen: c.need_screen == null ? -1 : c.need_screen,
                catering_amount: c.catering_amount == null ? -1 : c.catering_amount };
      const roomKeys = ['date','cust_type','room_type','category','nights','rooms'];
      const venueKeys = ['date','cust_type','venue_id','people','layout','need_equip','is_full_day','hours','need_rehearsal','need_lighting','need_screen','catering_amount'];
      const keys = c.intent === 'room' ? roomKeys : venueKeys;
      const got = keys.filter(k => {
        const v = vConv[k];
        if (k === 'date' || k === 'cust_type' || k === 'room_type' || k === 'category' || k === 'layout' || k === 'need_equip') return !!v;
        if (k === 'is_full_day' || k === 'need_rehearsal' || k === 'need_lighting' || k === 'need_screen') return v >= 0;
        if (k === 'catering_amount') return v >= 0;
        return v > 0;
      });
      const totalQ = keys.length;
      const opts = (c.options || []).map(o => `<span class="vchip" onclick="useChip(this)">${esc(o)}</span>`).join('');
      /* 同步: 本轮方案已随参数更新, 写入方案板 */
      updatePlanBoard(c);
      addVMsg('ai',
        `<div class="vq">${esc(c.question)}</div>` +
        (Array.isArray(c.cards) && c.cards.length ? `<div style="margin-top:6px;font-size:12px;color:var(--muted)">🔄 已根据当前回答更新报价方案</div>` + renderPlanCards(c.cards) : '') +
        `<div class="vmini"><span class="badge blue">电话问答 · 第${got.length + 1}/${totalQ}问</span> 已确认：${got.length ? got.map(k => PARAM_CN[k] + '·' + vConv[k]).join('、') : '暂无'}</div>` +
        (opts ? `<div class="vopts">${opts}</div>` : ''));
      resetVChips();
      vAutoSend = true;
      setVStatus('🔊 正在播报问题…');
      speakV(c.question).then(resumeListening);
      return;
    }
    /* 2) 非引导场景: 回退原有自然语言查询 */
    const r = await API.get('/api/query?q=' + encodeURIComponent(q));
    let g = '';
    if (r.goto && TITLES[r.goto]) {
      g = `<div class="vopts"><button class="btn gold sm" onclick="gotoVoice('${r.goto}')">前往 ${esc(TITLES[r.goto])} →</button></div>`;
    }
    addVMsg('ai', esc(r.answer) + renderVData(r) + g);
    speakV(r.answer).then(resumeListening);
  } catch (e) {
    vTyping(false);
    addVMsg('ai', `<span class="badge red">错误</span> ${esc(e.message)}`);
    resumeListening();
  }
}

/* 不可满足时: 语音提示并重新询问该参数(回到上一问重新筛选) */
function vReask(param, msg) {
  if (window.speechSynthesis) speechSynthesis.cancel();
  updatePlanBoard(null);
  setVStatus('⚠️ ' + (msg || '暂无匹配方案，请调整条件'));
  addVMsg('ai', `<span class="badge red">⚠️ 无匹配</span> ${esc(msg || '当前条件无满足的房型/会场，请重新选择，或点「重新筛选」换条件')}`);
  if (vConv && param) {
    /* 清掉导致无匹配的参数, 让下一轮重新询问它(房间还需清分类一并重问) */
    if (vConv[param] != null) {
      if (typeof vConv[param] === 'number') vConv[param] = 0; else vConv[param] = '';
    }
    if (param === 'room_type') vConv.category = '';
  }
  vAutoSend = true;
  speakV(msg || '当前条件无法满足，请重新选择。').then(resumeListening);
}

function buildBookParam(c) {
  const p = { type: c.type, room_type: c.room_type, amount: c.amount, date: c.date };
  const det = [];
  if (c.category) det.push('早餐 ' + c.category);
  if (c.building) det.push('楼栋 ' + c.building);
  if (c.type === 'room') {
    if (c.nights) det.push(c.nights + '晚');
    if (c.rooms) det.push(c.rooms + '间');
  } else if (c.type === 'venue') {
    if (c.people) det.push(c.people + '人');
    if (c.layout) det.push('布局 ' + c.layout);
  }
  if (c.date) p.date = c.date;
  p.remark = det.length ? det.join(' · ') : '';
  return p;
}

async function doQuote() {
  const box = document.getElementById('quoteResult');
  let body;
  if (quoteTab === 'venue') {
    const vS = document.getElementById('qVenueStart').value;
    const vE = document.getElementById('qVenueEnd').value;
    let vH = 0;
    if (vS && vE) vH = minutesBetween(vS, vE) / 60;
    quoteVenueHours();
    body = {
      type: 'venue', venue_id: Number(document.getElementById('qVenueId').value),
      is_full_day: document.getElementById('qVenueMode').value === 'full' ? 1 : 0,
      hours: vH,
      is_evening: Number(document.getElementById('qVenueEvening').value),
      need_lighting: Number(document.getElementById('qVenueLight').value),
      need_screen: Number(document.getElementById('qVenueScreen').value),
      catering_amount: Number(document.getElementById('qVenueCater').value || 0),
    };
    if (document.getElementById('qVenueMode').value === 'hour') body.price_by_hour = 1;
  } else {
    const qIn = document.getElementById('qRoomIn').value;
    const qOut = document.getElementById('qRoomOut').value;
    let qN = 1;
    if (qIn && qOut) {
      const dn = daysBetween(qIn, qOut);
      qN = dn >= 1 ? dn : 1;
    }
    body = {
      type: 'room', building: document.getElementById('qRoomBuilding').value,
      room_type: document.getElementById('qRoomType').value,
      category: document.getElementById('qRoomCategory').value,
      cust_type: document.getElementById('qRoomCust').value,
      nights: qN, check_in: qIn, check_out: qOut,
      rooms: Number(document.getElementById('qRoomCount').value || 1),
    };
  }
  const r = await API.post('/api/quote', body);
  if (r.code !== 0) { toast(r.msg || '计算失败', 'err'); return; }
  let qname = '';
  if (quoteTab === 'venue') {
    const qs = document.getElementById('qVenueId');
    qname = qs.selectedOptions[0] ? qs.selectedOptions[0].text.split(' (')[0] : '会场';
  }
  window.__lastQuote = Object.assign({}, body, { name: qname, total: r.total, desc: (r.detail || []).map(d => d.label).join('、') });
  box.innerHTML = `
    <div style="color:var(--muted);font-size:12.5px">预估总费用</div>
    <div class="total">${money(r.total)}</div>
    <div class="items">${(r.detail || []).map(d => `· ${esc(d.label)}: ${money(d.amount)}${d.remark ? ' <span style="color:var(--muted)">' + esc(d.remark) + '</span>' : ''}`).join('<br>')}</div>
    <div class="form-actions" style="margin-top:14px">
      <button class="btn gold" onclick="quoteToBooking()">📋 转为预订</button>
      <button class="btn" onclick="gotoPage('pay',{amount:${r.total},subject:'报价单'})">💳 直接发起支付</button>
    </div>`;
  box.classList.add('show');
  toast('报价计算完成', 'ok');

function quoteToBooking() {
  const q = window.__lastQuote;

  if (q.type === 'room') {
    gotoPage('booking', { type: 'room', room_type: q.room_type, building: q.building, category: q.category, amount: q.total, remark: q.desc, date: q.check_in || undefined, source: '智能报价结果' });

async function loadDayCombos() {
  const date = document.getElementById('cbDate').value;
  if (!date) { toast('请先选择未来日期', 'err'); return; }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = new Date(date + 'T00:00:00');
  if (d < today) { toast('请选择今天或未来日期', 'err'); return; }
  document.getElementById('cbHint').textContent = '正在加载可订组合…';
  let rooms = [], venues = [];
  try { [rooms, venues] = await Promise.all([API.get('/api/rooms/pricing'), API.get('/api/venues/pricing')]); } catch (e) { rooms = []; venues = []; }
  window.__comboRooms = rooms || [];
  window.__comboVenues = venues || [];
  renderCombos();
  document.getElementById('cbHint').textContent = `${date} 共 ${window.__comboRooms.length} 项客房 + ${window.__comboVenues.length} 项会场可订`;
}
function renderCombos() {
  const box = document.getElementById('cbList');
  const rooms = window.__comboRooms || [];
  const venues = window.__comboVenues || [];
  const base = document.getElementById('cbDate').value || addDaysISO(new Date(), 1);
  const roomHtml = rooms.length ? rooms.map((r, i) => `
    <div class="combo-item" data-k="room" data-i="${i}">
      <input type="checkbox" class="cb" onchange="comboCalc()">
      <div class="ci">
        <div class="t">${esc(r.building)} · ${esc(r.room_type)} <span class="badge gold">${esc(r.category)}</span></div>
        <div class="s">${r.cust_type === 'study_travel' ? '研学考察' : '政府及企业'} · ${money(r.price)}/间·晚</div>
      </div>
      <div class="cn"><span>间数</span><input type="number" class="cq" value="1" min="1" onchange="comboCalc()"></div>
      <div class="cn"><span>入住</span><input type="date" class="cin" value="${base}" onchange="comboCalc()"></div>
      <div class="cn"><span>离店</span><input type="date" class="cout" value="${addDaysISO(new Date(base + 'T00:00:00'), 1)}" onchange="comboCalc()"></div>
      <span class="cn-days">共 <b class="cdv">1</b> 晚</span>
      <div class="amt">${money(r.price)}</div>
    </div>`).join('') : '<div class="empty"><div class="big">🛏️</div>暂无客房定价组合</div>';
  const venueHtml = venues.length ? venues.map((v, i) => {
    const modes = [['full', '全天'], ['half', '半天']];
    if (v.price_by_hour) modes.push(['hour', '按小时']);
    return `
    <div class="combo-item" data-k="venue" data-i="${i}">
      <input type="checkbox" class="cb" onchange="comboCalc()">
      <div class="ci">
        <div class="t">${esc(v.name)} <span class="badge blue">${esc(v.area)}</span></div>
        <div class="s">半天 ${money(v.price_half_day)} · 全天 ${money(v.price_full_day)}${v.price_by_hour ? ' · 小时 ' + money(v.price_hourly) : ''}</div>
      </div>
      <div class="cn"><span>场次</span><select class="cs" onchange="comboCalc()">${modes.map(m => `<option value="${m[0]}">${m[1]}</option>`).join('')}</select></div>
      <div class="cn"><span>开始</span><input type="date" class="vstart" value="${base}" onchange="comboCalc()"></div>
      <div class="cn"><span>结束</span><input type="date" class="vend" value="${addDaysISO(new Date(base + 'T00:00:00'), 1)}" onchange="comboCalc()"></div>
      <div class="cn"><span>数量</span><input type="number" class="cq" value="1" min="1" onchange="comboCalc()"></div>
      <span class="cn-days">共 <b class="cdv">1</b> 天</span>
      <div class="amt">${money(v.price_full_day)}</div>
    </div>`;
  }).join('') : '<div class="empty"><div class="big">🏛️</div>暂无会场定价组合</div>';
  box.innerHTML = `<div class="combo-group">🏨 客房组合</div>${roomHtml}<div class="combo-group">🏛️ 会场组合</div>${venueHtml}`;
  document.getElementById('cbFoot').style.display = 'block';
  comboCalc();
}
function comboDays(el) {
  const vs = el.querySelector('.vstart'); const ve = el.querySelector('.vend');
  if (!vs || !ve || !vs.value || !ve.value) return 1;
  const n = daysBetween(vs.value, ve.value) + 1; // 含首尾两天
  return n >= 1 ? n : 1;
}
function comboCalc() {
  let total = 0, count = 0;
  document.querySelectorAll('#cbList .combo-item').forEach(el => {
    const i = Number(el.dataset.i);
    const amtEl = el.querySelector('.amt');
    const dvEl = el.querySelector('.cdv');
    if (!el.querySelector('.cb').checked) {
      amtEl.textContent = '¥0.00';
      if (dvEl) dvEl.textContent = el.dataset.k === 'room' ? comboNights(el) : comboDays(el);
      return;
    }
    let amt = 0;
    if (el.dataset.k === 'room') {
      const r = (window.__comboRooms || [])[i];
      const q = Number(el.querySelector('.cq').value || 1);
      const n2 = comboNights(el);
      if (dvEl) dvEl.textContent = n2;
      amt = r ? r.price * q * n2 : 0;
    } else {
      const v = (window.__comboVenues || [])[i];
      const mode = el.querySelector('.cs').value;
      const q = Number(el.querySelector('.cq').value || 1);
      const days = comboDays(el);
      if (dvEl) dvEl.textContent = days;
      const unit = v ? (mode === 'half' ? v.price_half_day : mode === 'hour' ? v.price_hourly : v.price_full_day) : 0;
      amt = unit * q * days;
    }
    amtEl.textContent = money(amt);
    total += amt; count++;
  });
  document.querySelector('.combo-total').textContent = money(total);
  document.querySelector('.combo-count').textContent = count;
}
async function submitCombos() {
  const customer = document.getElementById('cbCustomer').value.trim();
  const date = document.getElementById('cbDate').value;
  if (!customer) { toast('请填写客户姓名', 'err'); return; }
  if (!date) { toast('请先选择未来日期', 'err'); return; }
  const items = [];
  document.querySelectorAll('#cbList .combo-item').forEach(el => {
    if (!el.querySelector('.cb').checked) return;
    const i = Number(el.dataset.i);
    if (el.dataset.k === 'room') {
      const r = (window.__comboRooms || [])[i];
      if (!r) return;
      const q = Number(el.querySelector('.cq').value || 1);
      const n2 = comboNights(el);
      const cin = el.querySelector('.cin').value;
      const cout = el.querySelector('.cout').value;
      items.push({ type: 'room', room_type: r.room_type, building: r.building, category: r.category, cust_type: r.cust_type, rooms: q, nights: n2, check_in: cin, check_out: cout, amount: r.price * q * n2 });
    } else {
      const v = (window.__comboVenues || [])[i];
      if (!v) return;
      const mode = el.querySelector('.cs').value;
      const q = Number(el.querySelector('.cq').value || 1);
      const days = comboDays(el);
      const vstart = el.querySelector('.vstart').value;
      const vend = el.querySelector('.vend').value;
      const unit = mode === 'half' ? v.price_half_day : mode === 'hour' ? v.price_hourly : v.price_full_day;
      const session = mode === 'half' ? '半天' : mode === 'hour' ? '按小时' : '全天';
      items.push({ type: 'venue', venue: v.name, session, rooms: q, nights: days, check_in: vstart, check_out: vend, amount: unit * q * days });
    }
  });
  if (!items.length) { toast('请至少勾选 1 个项目组合', 'err'); return; }
  const body = { customer, phone: document.getElementById('cbPhone').value.trim(), date, remark: document.getElementById('cbRemark').value.trim(), items };
  const r = await API.post('/api/booking/batch', body);
  if (r.code !== 0) { toast(r.msg || '组合预订失败', 'err'); return; }
  const total = items.reduce((s, x) => s + Number(x.amount || 0), 0);
  toastAction(`组合预订成功 · 共 ${r.count} 张预订单 · 合计 ${money(total)}`, '查看预订', () => gotoPage('booking'), 'ok');
  render();
}
function bkDateSync() {
  const inEl = document.getElementById('bkDate');
  const outEl = document.getElementById('bkDateEnd');
  const daysEl = document.getElementById('bkDays');
  if (!outEl || !daysEl) return;
  if (!inEl.value) { outEl.value = ''; daysEl.value = '1 天'; return; }
  if (!outEl.value || daysBetween(inEl.value, outEl.value) < 1) {
    outEl.value = addDaysISO(new Date(inEl.value + 'T00:00:00'), 1);
  }
  const n = daysBetween(inEl.value, outEl.value);
  daysEl.value = (n >= 1 ? n : 1) + ' 天';
}
async function submitBooking() {
  const customer = document.getElementById('bkCustomer').value.trim();
  if (!customer) { toast('请填写客户姓名', 'err'); return; }
  const bIn = document.getElementById('bkDate').value;
  const bOut = document.getElementById('bkDateEnd').value;
  let bN = 1;
  if (bIn && bOut) { const dn = daysBetween(bIn, bOut); bN = dn >= 1 ? dn : 1; }
  const body = {
    customer, phone: document.getElementById('bkPhone').value.trim(),
    type: document.getElementById('bkType').value,
    room_type: document.getElementById('bkRoomType').value,
    date: bIn,
    check_in: bIn,
    check_out: bOut,
    nights: bN,
    rooms: Number(document.getElementById('bkQty').value || 1),
    amount: Number(document.getElementById('bkAmount').value || 0),
    remark: document.getElementById('bkRemark').value.trim(),
  };
  const r = await API.post('/api/booking', body);
  if (r.code !== 0) { toast(r.msg || '预订失败', 'err'); return; }
  toastAction(`预订成功 (${r.order.id})`, '立即支付', () => gotoPage('pay', { order_id: r.order.id, amount: Number(r.order.amount || body.amount || 0), auto_create: true, subject: '预订订单' }));
  render();
}

async function createPayWith(orderId, amount, subject) {
  if (!orderId) return null;
  const r = await API.post('/api/pay/create', { order_id: orderId, amount: amount || 0, subject: subject || '龙顺庄园预订' });
  if (r.code !== 0) { toast(r.msg || '下单失败', 'err'); return null; }
  return r.payment;
}
async function createPay() {
  const orderId = prompt('请输入要发起支付的预订订单号 (ID):');
  if (!orderId) return;
  const amount = Number(prompt('请输入支付金额 (元):') || 0);
  if (amount <= 0) { toast('金额无效', 'err'); return; }
  const p = await createPayWith(orderId, amount, '龙顺庄园预订');
  if (p) { toast(`支付单创建成功: ${p.payment_id}`, 'ok'); render(); }
}
async function mockPay(orderId) {
  const r = await API.post('/api/pay/mock', { order_id: orderId });
  if (r.code !== 0) { toast(r.msg || '模拟支付失败', 'err'); return; }
  toastAction(`模拟支付成功 (${orderId})`, '查看预订', () => gotoPage('booking'));
  render();
}
